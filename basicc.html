<!DOCTYPE html>
<html>
<head>
    <title>Simple HTML Example</title>
</head>
<body>

    <h2>My Web Page</h2>
    <p id="demo">Hello! Welcome to my website.</p>

    <button onclick="changeText()">Click Here</button>

    <script>
        function changeText() {
            document.getElementById("demo").innerHTML = "You clicked the button!";
        }
    </script>

</body>
</html>
